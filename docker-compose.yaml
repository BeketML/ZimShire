name: zimshire

# ─────────────────────────────────────────────────────────────────────────────
# QDRANT DATA SAFETY
#   `docker compose down`       → containers stopped, ALL named volumes kept
#   `docker compose down -v`    → !! DELETES qdrantdata (all indexed chunks) !!
#   `docker volume rm zimshire_qdrantdata` → !! same !!
#
# Never use `down -v` unless you intend to re-ingest.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zimshire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - zimshire

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: zimshire-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant slim image has no curl/wget — use bash TCP socket check
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - zimshire

  mcp:
    build: .
    image: zimshire:latest
    container_name: zimshire-mcp
    restart: unless-stopped
    command: ["python", "-m", "mcp_server.main", "--transport", "streamable-http", "--port", "8001"]
    ports:
      - "${MCP_PORT:-8001}:8001"
    env_file: .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 8001)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    volumes:
      - model_cache:/root/.cache
    networks:
      - zimshire

  api:
    build: .
    image: zimshire:latest
    container_name: zimshire-api
    restart: unless-stopped
    # Runs: alembic upgrade head → setup_langgraph_tables.py → uvicorn
    command: ["/bin/sh", "scripts/start_api.sh"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Override host-side URLs so containers resolve each other by service name
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      QDRANT_URL: "http://qdrant:6333"
      MCP_BASE_URL: "http://mcp:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
    networks:
      - zimshire

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: zimshire-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zimshire

networks:
  zimshire:
    driver: bridge

volumes:
  pgdata:
  # NEVER run `docker compose down -v` — this volume holds all indexed Qdrant chunks
  qdrantdata:
  pgadmin_data:
  # Shared fastembed / HuggingFace model cache (avoids re-downloading on restart)
  model_cache:
